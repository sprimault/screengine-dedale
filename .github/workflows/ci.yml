# Intégration continue.
#
# Les actions sont épinglées au SHA, le tag lisible en commentaire. Un tag de
# majeure comme `@v7` est mobile : il désigne un contenu qui change sans que ce
# dépôt bouge, donc du code tiers exécuté avec nos droits. Le SHA ne se réécrit
# pas. Contrepartie assumée : relever les versions est une opération manuelle.
#
# Tout passe par le Makefile, comme en local. Une commande cargo écrite ici serait
# une seconde définition du contrôle, et c'est celle qu'on ne peut pas essayer
# avant de pousser.
#
# **Ce qui se joue ici et nulle part ailleurs** : le jeu compile contre le commit
# du moteur que `Cargo.toml` épingle, sans la redirection locale vers le clone
# voisin. Une API employée mais pas encore poussée là-bas échoue ici, et c'est le
# seul endroit qui le dise.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # L'audit doit tourner même quand personne ne contribue : un avis publié en
  # amont n'attend pas la prochaine PR.
  schedule:
    - cron: '0 6 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verification:
    name: Format, lint, licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Chaîne Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      # **Aucun paquet système à installer**, et c'est vérifié plutôt que supposé :
      # la CI du moteur compile et teste le même arbre de dépendances sur
      # `ubuntu-latest` sans rien installer. `winit` charge X11 et Wayland
      # dynamiquement à l'exécution, donc l'édition de liens ne réclame rien — et
      # rien n'ouvre de fenêtre ici de toute façon.
      - name: Outils
        run: cargo install cargo-deny --locked

      - run: make fmt
      - run: make lint
      - run: make deny

  tests:
    name: Tests — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Chaîne Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - run: make test

  audit:
    name: Avis de sécurité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Chaîne Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # @latest délibérément : cargo-audit ne signale pas des règles mais des
      # avis, et son intérêt est de connaître les derniers.
      - name: Outils
        run: cargo install cargo-audit --locked

      - run: make audit
