# Licences et provenance des dépendances, contrôlées par `make deny`.
#
# Tout ce qui entre ici vient par `screengine-play`, dont le jeu est le seul
# consommateur : winit, softbuffer, png et leur arbre.

[graph]
all-features = true

[licenses]
# Une licence s'ajoute à la liste avec la dépendance qui l'amène.
# Apache-2.0, ISC et Unicode-3.0 arrivent avec winit et softbuffer.
allow = ["MIT", "Apache-2.0", "ISC", "Unicode-3.0"]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Les versions multiples viennent toutes de l'arbre de l'étage d'accueil, que ce
# dépôt ne choisit pas. Une dizaine d'avertissements en venaient dans le moteur,
# et du bruit permanent finit par masquer celui qui compte.
#
# `skip-tree` n'agit que sur cette section : `advisories` et `cargo audit`
# continuent de parcourir l'arbre entier, vulnérabilités comprises.
skip-tree = [{ crate = "screengine-play" }]

[sources]
unknown-registry = "deny"
# **Pas `deny` ici, contrairement au moteur** : le jeu prend `screengine-play`
# par git, faute d'être publié sur crates.io. Le dépôt est nommé plutôt
# qu'autorisé en bloc, et c'est le seul que ce projet admette.
unknown-git = "deny"
# Un avertissement `unmatched-source` sur cette ligne dirait que la source git
# n'entre pas dans le graphe, donc qu'une redirection locale a pris sa place.
# Aucune n'existe : le moteur se récupère depuis son dépôt partout.
allow-git = ["https://github.com/sprimault/screengine"]
